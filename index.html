
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            width: 100%;
            max-width: 430px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 22px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5266d5;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #resultBox {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .placed {
            background: #d4edda;
            color: #155724;
        }

        .not-placed {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Placement Predictor</h1>

        <p class="subtitle">
            Predict your placement chances using Machine Learning
        </p>

        <form id="predictorForm">

            <label for="cgpa">Enter your CGPA</label>
            <input
                type="number"
                id="cgpa"
                min="0"
                max="10"
                step="0.01"
                placeholder="Example: 8.5"
                required
            >

            <label for="iq">Enter your IQ</label>
            <input
                type="number"
                id="iq"
                min="1"
                max="300"
                placeholder="Example: 110"
                required
            >

            <button type="submit" id="predictButton">
                Predict Placement
            </button>

        </form>

        <div id="resultBox"></div>

    </div>

    <script>
        document.getElementById('predictorForm')
            .addEventListener('submit', async function(e) {

            e.preventDefault();

            const cgpa = parseFloat(
                document.getElementById('cgpa').value
            );

            const iq = parseInt(
                document.getElementById('iq').value
            );

            const resultBox = document.getElementById('resultBox');
            const button = document.getElementById('predictButton');

            button.disabled = true;
            button.innerText = 'Predicting...';

            try {

                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cgpa: cgpa,
                        iq: iq
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Prediction failed');
                }

                resultBox.style.display = 'block';

                if (data.prediction === 1) {

                    resultBox.className = 'placed';

                    resultBox.innerText =
                        'Congratulations! High Chance of Placement!';

                } else {

                    resultBox.className = 'not-placed';

                    resultBox.innerText =
                        'Low Chance of Placement. Keep Improving!';

                }

            } catch (error) {

                resultBox.style.display = 'block';
                resultBox.className = 'not-placed';
                resultBox.innerText = 'Error: ' + error.message;

            } finally {

                button.disabled = false;
                button.innerText = 'Predict Placement';

            }

        });
    </script>

</body>
</html>
